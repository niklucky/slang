name: Check

on:
  workflow_call:
  pull_request:

jobs:
  lint-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: slang
          POSTGRES_PASSWORD: slang
          POSTGRES_DB: slang
        ports:
          - 5802:5432
        options: >-
          --health-cmd "pg_isready -U slang -d slang"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://slang:slang@localhost:5802/slang
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
