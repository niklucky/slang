name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  docker:
    name: Build & push image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and version
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose and env files
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SLANG_ENV: ${{ secrets.SLANG_ENV }}
        run: |
          printf '%s\n' "$SLANG_ENV" > /tmp/slang.env
          chmod 600 /tmp/slang.env
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'install -d /opt/slang'
          scp -i ~/.ssh/deploy_key deploy/compose.yml "$SSH_USER@$SSH_HOST:/opt/slang/compose.yml"
          scp -i ~/.ssh/deploy_key /tmp/slang.env "$SSH_USER@$SSH_HOST:/opt/slang/.env"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'chmod 600 /opt/slang/.env'
          rm -f /tmp/slang.env

      - name: Pull and start
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /opt/slang && SLANG_VERSION='$VERSION' docker compose pull && SLANG_VERSION='$VERSION' docker compose up -d"

      - name: Verify deployment
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            cd /opt/slang
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:5800/ -o /dev/null; then
                echo "App is up"
                docker compose ps
                exit 0
              fi
              sleep 3
            done
            echo "App did not become healthy in time"
            docker compose ps
            exit 1
          '
